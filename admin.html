<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Upsido Admin</title>
<style>
:root{--bg:#F8FAFC;--card:#fff;--tx:#0F172A;--tx2:#64748B;--ln:#E2E8F0;--ink:#0F172A;--acc:#EA580C;--ok:#059669;--bad:#DC2626}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{margin:0;letter-spacing:-.02em}button,input,select,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--ln);background:var(--card);border-radius:999px;padding:9px 18px;font-weight:600;cursor:pointer;transition:transform .15s,background-color .2s,border-color .2s}
.btn:hover{border-color:var(--tx2);transform:translateY(-1px)}.btn:active{transform:scale(.97)}.btn.p{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.a{background:var(--acc);color:#fff;border-color:var(--acc)}.btn.d{color:var(--bad)}.btn[disabled]{opacity:.55;pointer-events:none}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:#fff}input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--acc) 35%,transparent);border-color:var(--acc)}
label{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--tx2)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:22px}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}#login form{width:min(400px,100%);display:grid;gap:14px}
header{background:var(--card);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:5}.bar{max-width:1100px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-weight:800;font-size:19px}.logo b{color:var(--acc)}nav{display:flex;gap:6px;flex:1;flex-wrap:wrap}nav button{border:0;background:none;padding:8px 14px;border-radius:999px;font-weight:600;color:var(--tx2);cursor:pointer}nav button.on{background:var(--ink);color:#fff}
main{max-width:1100px;margin:0 auto;padding:26px 20px 60px}.row{display:flex;gap:12px;align-items:end;flex-wrap:wrap;justify-content:space-between;margin-bottom:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}.stats b{font-size:30px;color:var(--acc);display:block}.stats span{color:var(--tx2);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:var(--tx2);font-size:12px;padding:10px 12px;border-bottom:1px solid var(--ln)}td{padding:12px;border-bottom:1px solid var(--ln);vertical-align:top}tr:last-child td{border:0}
.tbl{overflow-x:auto;padding:0}.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;background:#F1F5F9;color:var(--tx2)}.pill.pub{background:#D1FAE5;color:#047857}.pill.ft{background:#FFEDD5;color:#C2410C}
.acts{display:flex;gap:6px;flex-wrap:wrap}.acts .btn{padding:5px 12px;font-size:13px}.muted{color:var(--tx2);font-size:13px}.empty{padding:36px;text-align:center;color:var(--tx2)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;place-items:center;padding:16px;z-index:20;overflow:auto}.ov.on{display:grid}.ov .card{width:min(680px,100%);max-height:94vh;overflow:auto}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;opacity:0;transition:all .3s;z-index:50;pointer-events:none}#toast.on{opacity:1;transform:translateX(-50%)}#toast.err{background:var(--bad)}
.drop{border:2px dashed var(--ln);border-radius:14px;padding:28px;text-align:center;transition:border-color .2s,background-color .2s}.drop.hl{border-color:var(--acc);background:#FFF7ED}
@media(max-width:640px){.grid{grid-template-columns:1fr}.hide-sm{display:none}}
</style></head><body>
<div id="login"><form class="card" id="lf"><div><div class="logo">Upsido<b>.ai</b> Admin</div><p class="muted" style="margin:6px 0 0">Sign in to manage workshops, registrations and the brochure.</p></div>
<label>Email<input id="le" type="email" autocomplete="username" required></label><label>Password<input id="lp" type="password" autocomplete="current-password" required></label>
<button class="btn a" id="lb">Sign in</button><p class="muted" id="lerr" style="color:var(--bad);margin:0" role="alert"></p></form></div>
<div id="app" hidden>
<header><div class="bar"><span class="logo">Upsido<b>.ai</b></span><nav id="nav"><button data-t="ws" class="on">Workshops</button><button data-t="rg">Registrations</button><button data-t="br">Brochure</button></nav><button class="btn" id="out">Sign out</button></div></header>
<main><div class="stats" id="stats"></div><section id="t-ws"></section><section id="t-rg" hidden></section><section id="t-br" hidden></section></main></div>
<div class="ov" id="ov"><div class="card" id="wf"></div></div><div id="toast" role="status"></div>
<script>
var $=function(s,r){return(r||document).querySelector(s)},TK=sessionStorage.getItem('uadm'),WS=[];
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(m,e){var t=$('#toast');t.textContent=m;t.className='on'+(e?' err':'');clearTimeout(toast.t);toast.t=setTimeout(function(){t.className=''},3200)}
async function api(p,o){o=o||{};o.headers=Object.assign({},o.headers||{});if(TK)o.headers.Authorization='Bearer '+TK;if(o.json){o.body=JSON.stringify(o.json);o.headers['Content-Type']='application/json'}
 var r=await fetch(p,o),j=null;try{j=await r.clone().json()}catch(x){}
 if(r.status===401&&TK&&p.indexOf('login')<0){logout();throw new Error('Session expired. Please sign in again.')}
 if(!r.ok)throw new Error((j&&j.error)||'Request failed ('+r.status+')');return o.raw?r:j}
function logout(){TK=null;sessionStorage.removeItem('uadm');$('#app').hidden=true;$('#login').hidden=false}
function show(){$('#login').hidden=true;$('#app').hidden=false;stats();tab('ws')}
$('#lf').onsubmit=async function(e){e.preventDefault();var b=$('#lb');b.disabled=true;$('#lerr').textContent='';
 try{var j=await api('/api/admin/login',{method:'POST',json:{email:$('#le').value,password:$('#lp').value}});TK=j.token;sessionStorage.setItem('uadm',TK);$('#lp').value='';show()}catch(x){$('#lerr').textContent=x.message}b.disabled=false};
$('#out').onclick=logout;
$('#nav').onclick=function(e){var t=e.target.dataset&&e.target.dataset.t;if(t)tab(t)};
function tab(t){document.querySelectorAll('#nav button').forEach(function(b){b.classList.toggle('on',b.dataset.t===t)});['ws','rg','br'].forEach(function(k){$('#t-'+k).hidden=k!==t});({ws:loadWS,rg:loadRG,br:loadBR})[t]()}
async function stats(){try{var s=await api('/api/admin/stats');$('#stats').innerHTML=[['Workshops',s.workshops],['Published',s.published],['Registrations',s.registrations],['Brochure',s.brochure?'Uploaded':'None']].map(function(x){return '<div class="card"><b>'+x[1]+'</b><span>'+x[0]+'</span></div>'}).join('')}catch(x){}}
/* workshops */
async function loadWS(){var el=$('#t-ws');try{WS=await api('/api/admin/workshops')}catch(x){toast(x.message,1);return}
 el.innerHTML='<div class="row"><div><h2>Workshops</h2><p class="muted" style="margin:4px 0 0">Published workshops appear on the landing page.</p></div><button class="btn a" id="nw">+ Add workshop</button></div><div class="card tbl">'+(WS.length?'<table><thead><tr><th>Workshop</th><th class="hide-sm">When</th><th>Status</th><th class="hide-sm">Seats</th><th></th></tr></thead><tbody>'+WS.map(function(w){return '<tr><td><b>'+esc(w.title)+'</b><div class="muted">'+esc(w.type)+' · '+esc(w.speaker||'No speaker')+'</div></td><td class="hide-sm">'+esc(w.date)+'<div class="muted">'+esc(w.start_time)+' - '+esc(w.end_time)+' IST</div></td><td><span class="pill '+(w.status==='published'?'pub':'')+'">'+esc(w.status)+'</span>'+(w.featured?' <span class="pill ft">featured</span>':'')+'</td><td class="hide-sm">'+w.registrations+(w.seats!=null?' / '+w.seats:'')+'</td><td><div class="acts"><button class="btn" data-a="edit" data-i="'+w.id+'">Edit</button><button class="btn" data-a="star" data-i="'+w.id+'">'+(w.featured?'Unfeature':'Feature')+'</button><button class="btn" data-a="vis" data-i="'+w.id+'">'+(w.status==='published'?'Hide':'Publish')+'</button><button class="btn d" data-a="del" data-i="'+w.id+'">Delete</button></div></td></tr>'}).join('')+'</tbody></table>':'<div class="empty">No workshops yet. Add your first one.</div>')+'</div>';
 $('#nw').onclick=function(){form()}}
$('#t-ws').onclick=async function(e){var b=e.target.closest('[data-a]');if(!b)return;var id=+b.dataset.i,w=WS.find(function(x){return x.id===id}),a=b.dataset.a;
 try{if(a==='edit')return form(w);if(a==='del'){if(!confirm('Delete "'+w.title+'"? Its registrations stay in the list.'))return;await api('/api/admin/workshops/'+id,{method:'DELETE'})}
 if(a==='star')await api('/api/admin/workshops/'+id,{method:'PATCH',json:{featured:!w.featured}});if(a==='vis')await api('/api/admin/workshops/'+id,{method:'PATCH',json:{status:w.status==='published'?'hidden':'published'}});toast('Saved');loadWS();stats()}catch(x){toast(x.message,1)}};
var TY=['Webinar','Workshop','Masterclass','Live Class','Bootcamp'],MO=['Live online','In person','Hybrid'],ST=['published','draft','hidden'];
function opts(l,v){return l.map(function(o){return '<option'+(o===v?' selected':'')+'>'+o+'</option>'}).join('')}
function form(w){w=w||{};$('#wf').innerHTML='<h2 style="margin-bottom:16px">'+(w.id?'Edit workshop':'Add workshop')+'</h2><form id="f" class="grid"><label class="full">Title<input name="title" required maxlength="150" value="'+esc(w.title)+'"></label><label>Type<select name="type">'+opts(TY,w.type||'Workshop')+'</select></label><label>Mode<select name="mode">'+opts(MO,w.mode||'Live online')+'</select></label><label>Date<input type="date" name="date" required value="'+esc(w.date)+'"></label><label>Speaker<input name="speaker" maxlength="100" value="'+esc(w.speaker)+'"></label><label>Start time (IST)<input type="time" name="start_time" required value="'+esc(w.start_time||'19:00')+'"></label><label>End time (IST)<input type="time" name="end_time" required value="'+esc(w.end_time||'20:30')+'"></label><label class="full">Short description<textarea name="description" rows="3" maxlength="1500">'+esc(w.description)+'</textarea></label><label class="full">What you will learn (one point per line, up to 10)<textarea name="learn" rows="4">'+esc((w.learn||[]).join('\n'))+'</textarea></label><label>Seats (blank = unlimited)<input type="number" min="0" name="seats" value="'+esc(w.seats)+'"></label><label>Price<input name="price" maxlength="40" placeholder="Free" value="'+esc(w.price)+'"></label><label>Status<select name="status">'+opts(ST,w.status||'published')+'</select></label><label style="align-content:end;display:flex;gap:8px;align-items:center"><input type="checkbox" name="featured" style="width:auto"'+(w.featured?' checked':'')+'> Featured</label><div class="full acts" style="justify-content:flex-end"><button type="button" class="btn" id="fc">Cancel</button><button class="btn a" id="fs">'+(w.id?'Save changes':'Create workshop')+'</button></div></form>';
 $('#ov').classList.add('on');$('#fc').onclick=function(){$('#ov').classList.remove('on')};
 $('#f').onsubmit=async function(e){e.preventDefault();var f=e.target,d={};['title','type','mode','date','speaker','start_time','end_time','description','learn','seats','price','status'].forEach(function(k){d[k]=f[k].value});d.featured=f.featured.checked;$('#fs').disabled=true;
  try{await api(w.id?'/api/admin/workshops/'+w.id:'/api/admin/workshops',{method:w.id?'PATCH':'POST',json:d});$('#ov').classList.remove('on');toast('Workshop saved');loadWS();stats()}catch(x){toast(x.message,1);$('#fs').disabled=false}}}
$('#ov').onclick=function(e){if(e.target.id==='ov')$('#ov').classList.remove('on')};
/* registrations */
async function loadRG(){var el=$('#t-rg');if(!el.dataset.init){el.dataset.init=1;el.innerHTML='<div class="row"><div><h2>Registrations</h2></div><div class="acts"><select id="rw" style="width:auto"></select><input id="rq" placeholder="Search name, email, phone" style="width:230px"><button class="btn" id="rx">Export CSV</button></div></div><div class="card tbl" id="rl"></div>';$('#rw').onchange=$('#rq').oninput=function(){clearTimeout(loadRG.t);loadRG.t=setTimeout(rows,200)};$('#rx').onclick=csv;
  $('#rl').onclick=async function(e){var b=e.target.closest('[data-d]');if(!b||!confirm('Delete this registration?'))return;try{await api('/api/admin/registrations/'+b.dataset.d,{method:'DELETE'});toast('Deleted');rows();stats()}catch(x){toast(x.message,1)}}}
 try{WS=await api('/api/admin/workshops')}catch(x){}var v=$('#rw').value;$('#rw').innerHTML='<option value="">All workshops</option><option value="none">General interest</option>'+WS.map(function(w){return '<option value="'+w.id+'">'+esc(w.title)+'</option>'}).join('');$('#rw').value=v;rows()}
function qs(){var p=new URLSearchParams(),w=$('#rw').value,q=$('#rq').value.trim();if(w)p.set('workshop_id',w);if(q)p.set('q',q);return p.toString()}
async function rows(){try{var l=await api('/api/admin/registrations?'+qs());$('#rl').innerHTML=l.length?'<table><thead><tr><th>Name</th><th>Contact</th><th class="hide-sm">Workshop</th><th class="hide-sm">Registered</th><th></th></tr></thead><tbody>'+l.map(function(r){return '<tr><td><b>'+esc(r.name)+'</b></td><td>'+esc(r.email)+'<div class="muted">'+esc(r.phone)+(r.whatsapp?' · WhatsApp':'')+'</div></td><td class="hide-sm">'+esc(r.workshop_title||'')+'</td><td class="hide-sm muted">'+esc(new Date(r.created_at).toLocaleString())+'</td><td><button class="btn d" data-d="'+r.id+'" style="padding:5px 12px;font-size:13px">Delete</button></td></tr>'}).join('')+'</tbody></table>':'<div class="empty">No registrations found.</div>'}catch(x){toast(x.message,1)}}
async function csv(){try{var r=await api('/api/admin/registrations.csv?'+qs(),{raw:1}),u=URL.createObjectURL(await r.blob()),a=document.createElement('a');a.href=u;a.download='upsido-registrations.csv';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u)}catch(x){toast(x.message,1)}}
/* brochure */
async function loadBR(){var el=$('#t-br'),i;try{i=await api('/api/brochure/info')}catch(x){toast(x.message,1);return}
 el.innerHTML='<div class="row"><div><h2>Course brochure (PDF)</h2><p class="muted" style="margin:4px 0 0">The landing page Download brochure button serves this file.</p></div></div><div class="card">'+(i.available?'<p style="margin:0 0 14px"><b>'+esc(i.name)+'</b><br><span class="muted">'+(i.size/1024).toFixed(0)+' KB · updated '+esc(new Date(i.updated_at).toLocaleString())+'</span></p><div class="acts" style="margin-bottom:20px"><button class="btn" id="bd">Download current</button><button class="btn d" id="bx">Remove</button></div>':'<p class="muted" style="margin-top:0">No brochure uploaded yet.</p>')+'<div class="drop" id="dz"><p style="margin:0 0 12px"><b>'+(i.available?'Replace the brochure':'Upload the brochure')+'</b><br><span class="muted">Drop a PDF here, or choose a file. Max 15 MB.</span></p><input type="file" id="bf" accept="application/pdf,.pdf" style="max-width:300px"><p class="muted" id="bs" style="margin:12px 0 0"></p></div></div>';
 var up=async function(f){if(!f)return;if(!/\.pdf$/i.test(f.name)||f.type&&f.type!=='application/pdf'){$('#bs').textContent='Please choose a PDF file.';return}$('#bs').textContent='Uploading '+f.name+'...';
  try{await api('/api/admin/brochure',{method:'POST',body:f,headers:{'Content-Type':'application/pdf','X-Filename':f.name}});toast('Brochure uploaded');loadBR();stats()}catch(x){$('#bs').textContent=x.message;toast(x.message,1)}};
 $('#bf').onchange=function(){up(this.files[0])};var dz=$('#dz');['dragover','dragenter'].forEach(function(ev){dz.addEventListener(ev,function(e){e.preventDefault();dz.classList.add('hl')})});['dragleave','drop'].forEach(function(ev){dz.addEventListener(ev,function(e){e.preventDefault();dz.classList.remove('hl')})});dz.addEventListener('drop',function(e){up(e.dataTransfer.files[0])});
 if(i.available){$('#bd').onclick=async function(){try{var r=await fetch('/api/brochure'),u=URL.createObjectURL(await r.blob()),a=document.createElement('a');a.href=u;a.download=i.name;a.click();URL.revokeObjectURL(u)}catch(x){toast(x.message,1)}};$('#bx').onclick=async function(){if(!confirm('Remove the brochure? The landing page button will fall back to its built-in copy.'))return;try{await api('/api/admin/brochure',{method:'DELETE'});toast('Removed');loadBR();stats()}catch(x){toast(x.message,1)}}}}
if(TK)show();
</script></body></html>
